<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Avsar - prototype</title>
<style>
:root{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--mute:#94a3b8;--teal:#14b8a6;--amber:#f59e0b}
*{box-sizing:border-box}body{margin:0;font-family:Calibri,Arial,sans-serif;background:var(--bg);color:var(--text);line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 16px 48px}h1{margin:0;font-size:2rem}.sub{color:var(--mute);margin:4px 0 16px}
.note{background:#422006;color:#fde68a;border-radius:10px;padding:10px 14px;font-size:.9rem;margin-bottom:20px}
.panel{background:var(--card);border-radius:14px;padding:18px;margin-bottom:20px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:560px){.grid{grid-template-columns:1fr}}
label{display:block;font-size:.85rem;color:var(--mute);margin-bottom:4px}
input,select{width:100%;padding:10px;border-radius:8px;border:1px solid #334155;background:#0b1220;color:var(--text);font-size:1rem}
button{cursor:pointer;border:0;border-radius:999px;padding:10px 20px;font-size:1rem;font-weight:700}
.go{background:var(--teal);color:#042f2e;margin-top:14px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.tab{background:#0b1220;color:var(--mute)}.tab.on{background:var(--amber);color:#1c1917}
.item{background:#0b1220;border-radius:12px;padding:14px;margin-bottom:12px}.item h3{margin:0 0 4px;font-size:1.05rem}
.meta{color:var(--mute);font-size:.85rem}.tag{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;font-weight:700;margin-right:6px}
.t-intern{background:#134e4a;color:#99f6e4}.t-schol{background:#451a03;color:#fcd34d}.t-scheme{background:#312e81;color:#c7d2fe}
.hot{color:#fca5a5;font-weight:700}ul{margin:6px 0 0 18px;padding:0;font-size:.9rem}a{color:var(--teal)}
</style></head><body><main>
<h1>Avsar</h1><p class="sub">Internships, scholarships and government schemes you qualify for.</p>
<div class="note">Prototype page with <b>sample data only</b>. In the real version, TinyFish agents will read live official sites.</div>
<div class="panel"><div class="grid">
<div><label for="course">Course</label><select id="course"><option>B.Tech CSE</option><option>B.Sc</option><option>BBA</option><option>Diploma</option></select></div>
<div><label for="year">Year</label><select id="year"><option>1st</option><option>2nd</option><option selected>3rd</option><option>4th</option></select></div>
<div><label for="skills">Skills</label><input id="skills" value="Python, HTML, Git"></div>
<div><label for="state">State</label><input id="state" value="Karnataka"></div>
<div><label for="cat">Category</label><select id="cat"><option>General</option><option>OBC</option><option>SC/ST</option><option>EWS</option></select></div>
<div><label for="inc">Family income per year</label><select id="inc"><option>Below 2.5 lakh</option><option selected>2.5 to 8 lakh</option><option>Above 8 lakh</option></select></div>
</div><button class="go" id="find">Find opportunities</button></div>
<div id="out" hidden><div class="tabs" id="tabs"></div><div id="list"></div></div>
<script>
const DATA=[
{t:"intern",title:"Backend Developer Intern",org:"Sample Company A",days:3,why:"Your Python and Git skills match. Open to 3rd year students.",docs:["Resume","College ID"]},
{t:"intern",title:"Web Development Intern",org:"Sample Startup B",days:9,why:"HTML matches. They also want some JavaScript, so mention any projects.",docs:["Resume","Portfolio link"]},
{t:"schol",title:"State Merit Scholarship",org:"Sample State Portal",days:5,why:"Your income range and course are covered. Needs marks above the cutoff.",docs:["Marksheet","Income certificate","Bank passbook"]},
{t:"schol",title:"Women in Tech Scholarship",org:"Sample Foundation C",days:20,why:"Open to B.Tech students. Check the gender requirement on the official page.",docs:["Marksheet","Essay","ID proof"]},
{t:"scheme",title:"Skill Training Scheme",org:"Sample Government Portal",days:14,why:"Open to college students above 18. Free certified course.",docs:["ID proof","College bonafide"]},
{t:"scheme",title:"Free Laptop Support Scheme",org:"Sample State Department",days:30,why:"Depends on state and income. Verify eligibility on the official site.",docs:["Income certificate","Domicile","Marksheet"]}];
const NAMES={all:"All",intern:"Internships",schol:"Scholarships",scheme:"Schemes"},LAB={intern:"Internship",schol:"Scholarship",scheme:"Scheme"};
let cur="all";const $=id=>document.getElementById(id);
function draw(){$("tabs").innerHTML=Object.keys(NAMES).map(k=>`<button class="tab ${k===cur?"on":""}" data-k="${k}">${NAMES[k]}</button>`).join("");
$("list").innerHTML=DATA.filter(d=>cur==="all"||d.t===cur).sort((a,b)=>a.days-b.days).map(d=>`<div class="item"><span class="tag t-${d.t}">${LAB[d.t]}</span><span class="${d.days<=5?"hot":"meta"}">Closes in ${d.days} days</span><h3>${d.title}</h3><div class="meta">${d.org}</div><p>${d.why}</p><div class="meta">Documents to keep ready:</div><ul>${d.docs.map(x=>`<li>${x}</li>`).join("")}</ul><p class="meta">Source: official site link goes here (sample).</p></div>`).join("");
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{cur=b.dataset.k;draw()})}
$("find").onclick=()=>{$("out").hidden=false;draw();$("out").scrollIntoView({behavior:"smooth"})};
</script></main></body></html>
